name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: ./build.sh

      - name: Zip
        run: ditto -c -k --keepParent KeepAwake.app KeepAwake-universal-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepAwake-universal-macOS
          path: KeepAwake-universal-macOS.zip

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KeepAwake-universal-macOS.zip
          generate_release_notes: true
