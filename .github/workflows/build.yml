name: build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install icon deps
        run: pip3 install --break-system-packages pillow

      - name: Build universal app + DMG
        run: ./build_dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepAwake-universal-macOS-dmg
          path: dist/KeepAwake.dmg

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KeepAwake.dmg
          generate_release_notes: true
